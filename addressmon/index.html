<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="refresh" content="300">
   <title>Endoor Address List</title>
<style>
:root {
  color-scheme: light dark;

  --bg-color: #ffffff;
  --text-color: #333333;
  --known-bg: #a4ffac;
  --unknown-bg: #ff8183;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --known-bg: #5bb161;
    --unknown-bg: #9f5052;
  }
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 2rem;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.mac-known {
   background-color: var(--known-bg);
}

.mac-unknown {
   background-color: var(--unknown-bg);
}
</style>
</head>
<body>
   <table></table>
   <script src="dump-table.js"></script>
</body>
</html>
